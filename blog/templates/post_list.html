{% extends "blog/base.html" %}

{% block content %}

<h1>Kichik Blog</h1>

{% for post in posts %}

<div class="post">

    <h2>
        <a href="{% url 'post_detail' post.pk %}">
            {{ post.title }}
        </a>
    </h2>

    <p>
        {{ post.content|truncatewords:30 }}
    </p>

    <small>
        Muallif: {{ post.author.username }}
    </small>

    <br>

    <small>
        {{ post.created_at }}
    </small>

</div>

{% empty %}

<p>Hozircha postlar yo‘q.</p>

{% endfor %}

{% endblock %}
