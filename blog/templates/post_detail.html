{% extends "blog/base.html" %}

{% block content %}

<h1>{{ post.title }}</h1>

<p>
    {{ post.content }}
</p>

<hr>

<p>
    Muallif: {{ post.author.username }}
</p>

<p>
    Yaratilgan: {{ post.created_at }}
</p>

{% if user == post.author %}

<a href="{% url 'post_update' post.pk %}">
    Tahrirlash
</a>

<a href="{% url 'post_delete' post.pk %}">
    O‘chirish
</a>

{% endif %}

<br><br>

<a href="{% url 'post_list' %}">
    ← Orqaga
</a>

{% endblock %}
