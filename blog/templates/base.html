<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kichik Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        nav {
            margin-bottom: 30px;
            padding: 15px;
            background: #222;
        }

        nav a {
            color: white;
            margin-right: 20px;
            text-decoration: none;
        }

        .post {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
        }
    </style>
</head>

<body>

<nav>
    <a href="{% url 'post_list' %}">Bosh sahifa</a>

    {% if user.is_authenticated %}

        <a href="{% url 'post_create' %}">
            Post yaratish
        </a>

        <a href="{% url 'logout' %}">
            Chiqish
        </a>

        <span style="color:white;">
            Salom, {{ user.username }}
        </span>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}
</nav>


{% block content %}

{% endblock %}

</body>
</html>
